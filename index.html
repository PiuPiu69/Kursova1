<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фінанси студента</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .auth-screen, .app-screen { display: none; }
        .auth-screen.active, .app-screen.active { display: block; }
        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .transaction-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .transaction-income { border-left: 5px solid green; }
        .transaction-expense { border-left: 5px solid red; }
        .income-text { color: green; font-weight: bold; }
        .expense-text { color: red; font-weight: bold; }
        .balance-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-amount { font-size: 48px; font-weight: bold; margin: 10px 0; }
        .delete-btn { background: #dc2626; padding: 5px 10px; font-size: 12px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div id="auth-screen" class="auth-screen active">
            <h1>💰 Фінанси студента</h1>
            <p>Керуй своїми доходами та витратами</p>
            <button onclick="signIn()">🚀 Увійти через Google</button>
        </div>

        <div id="app-screen" class="app-screen">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <img id="user-avatar" width="40" style="border-radius: 50%;">
                    <span id="user-name"></span>
                </div>
                <button onclick="logout()" style="background: #dc2626;">Вийти</button>
            </div>

            <div class="balance-card">
                <div>Поточний баланс</div>
                <div class="balance-amount" id="balance">0.00 ₴</div>
                <div>📈 Доходи: <span id="total-income">0</span> ₴</div>
                <div>📉 Витрати: <span id="total-expense">0</span> ₴</div>
            </div>

            <h3>➕ Додати транзакцію</h3>
            <select id="trans-type">
                <option value="income">📈 Дохід</option>
                <option value="expense">📉 Витрата</option>
            </select>
            <input type="number" id="trans-amount" placeholder="Сума">
            <select id="trans-category">
                <option value="Їжа">🍔 Їжа</option>
                <option value="Транспорт">🚗 Транспорт</option>
                <option value="Навчання">📚 Навчання</option>
                <option value="Розваги">🎬 Розваги</option>
                <option value="Житло">🏠 Житло</option>
                <option value="Зв'язок">📱 Зв'язок</option>
                <option value="Інше">📌 Інше</option>
            </select>
            <input type="text" id="trans-desc" placeholder="Опис">
            <button onclick="addTransaction()" style="background: #10b981;">💾 Зберегти</button>

            <h3>📋 Список транзакцій</h3>
            <div id="transactions-list"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDu4HEpjWVfJOE4GMji2ux-KK_47-YRvfw",
            authDomain: "kursova1-4e839.firebaseapp.com",
            projectId: "kursova1-4e839",
            storageBucket: "kursova1-4e839.firebasestorage.app",
            messagingSenderId: "580567528040",
            appId: "1:580567528040:web:81c77c2a05bf9c183841dd"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;

        window.signIn = () => {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
                .catch(e => alert("Помилка: " + e.message));
        };

        window.logout = () => {
            auth.signOut().then(() => location.reload());
        };

        window.addTransaction = async () => {
            if (!currentUser) return alert("Увійдіть!");
            
            const amount = parseFloat(document.getElementById('trans-amount').value);
            if (!amount || amount <= 0) return alert("Введіть суму!");
            
            try {
                await db.collection('transactions').add({
                    userId: currentUser.uid,
                    type: document.getElementById('trans-type').value,
                    amount: amount,
                    category: document.getElementById('trans-category').value,
                    description: document.getElementById('trans-desc').value || "",
                    date: new Date().toISOString()
                });
                
                document.getElementById('trans-amount').value = '';
                document.getElementById('trans-desc').value = '';
                await loadTransactions();
                alert("✅ Збережено!");
            } catch (e) {
                alert("Помилка: " + e.message);
            }
        };

        async function loadTransactions() {
            if (!currentUser) return;
            
            // Прибираємо orderBy, щоб уникнути помилки індексу
            const snapshot = await db.collection('transactions')
                .where('userId', '==', currentUser.uid)
                .get();
            
            const transactions = [];
            snapshot.forEach(doc => transactions.push({ id: doc.id, ...doc.data() }));
            
            // Сортуємо в пам'яті (замість orderBy в запиті)
            transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            const container = document.getElementById('transactions-list');
            if (transactions.length === 0) {
                container.innerHTML = '<p>📭 Немає транзакцій</p>';
            } else {
                container.innerHTML = transactions.map(t => `
                    <div class="transaction-item transaction-${t.type}">
                        <div>
                            <strong>${t.category}</strong><br>
                            ${t.description || 'Без опису'}<br>
                            <small>${new Date(t.date).toLocaleDateString()}</small>
                        </div>
                        <div class="${t.type === 'income' ? 'income-text' : 'expense-text'}">
                            ${t.type === 'income' ? '+' : '-'} ${t.amount} ₴
                        </div>
                        <button class="delete-btn" onclick="deleteTransaction('${t.id}')">🗑️</button>
                    </div>
                `).join('');
            }
            
            let income = 0, expense = 0;
            transactions.forEach(t => {
                if (t.type === 'income') income += t.amount;
                else expense += t.amount;
            });
            document.getElementById('balance').innerHTML = `${(income - expense).toFixed(2)} ₴`;
            document.getElementById('total-income').innerHTML = income;
            document.getElementById('total-expense').innerHTML = expense;
        }

        window.deleteTransaction = async (id) => {
            if (confirm("Видалити?")) {
                await db.collection('transactions').doc(id).delete();
                await loadTransactions();
            }
        };

        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL || '';
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('app-screen').classList.add('active');
                loadTransactions();
            } else {
                document.getElementById('auth-screen').classList.add('active');
                document.getElementById('app-screen').classList.remove('active');
            }
        });

        console.log("✅ Сайт готовий!");
    </script>
</body>
</html>
